[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "ultra-hdr-converter"
version = "0.1.0"
description = "Ultra HDR JPEG conversion pipeline using imagecodecs and custom gain maps."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [
  { name = "Mauro" }
]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12"
]
dependencies = [
  "imagecodecs>=2024.9.22",
  "numpy>=1.26.0"
]

[project.optional-dependencies]
cli = [
  "rich>=13.0.0"
]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.7.0",
  "mypy>=1.11.0",
]
gui = [
  "PySide6>=6.7.0"
]

[project.scripts]
uhdr-convert = "ultra_hdr_converter.ui.cli:main"
uhdr-gui = "ultra_hdr_converter.ui.gui:main"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.7.0",
  "mypy>=1.11.0",
  "rich>=13.0.0",
  "pyinstaller>=6.0.0"
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/ultra_hdr_converter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "PL", "I", "N", "A"]
ignore = ["E501", "PLR0913"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_unused_ignores = true
