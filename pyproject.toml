[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "ultra-hdr-converter"
version = "0.1.0"
description = "Ultra HDR JPEG conversion pipeline using imagecodecs and custom gain maps."
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name = "Mauro" }
]
dependencies = [
  "imagecodecs>=2024.9.22",
  "numpy>=1.26.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.7.0",
  "mypy>=1.11.0"
]

[project.scripts]
uhdr-convert = "ultra_hdr_converter.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.7.0",
  "mypy>=1.11.0"
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/ultra_hdr_converter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
warn_unused_ignores = true
