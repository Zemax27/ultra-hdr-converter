name: Release

on:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: linux
          - os: windows-latest
            asset_name: windows
          - os: macos-latest
            asset_name: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --extra gui

      - name: Activate virtual environment (Windows)
        if: runner.os == 'Windows'
        run: echo "$env:GITHUB_WORKSPACE\.venv\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Activate virtual environment (Unix)
        if: runner.os != 'Windows'
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

      # Linux: install dependencies for Nuitka.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y patchelf ccache

      - name: Generate native OS icons
        shell: bash
        run: |
          uv run --with pillow python -c "from PIL import Image; img = Image.open('src/ultra_hdr_converter/ui/assets/icon.png'); img.save('src/ultra_hdr_converter/ui/assets/icon.ico'); img.save('src/ultra_hdr_converter/ui/assets/icon.icns')"

      - name: Build GUI bundle
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: src/ultra_hdr_converter/ui/gui.py
          mode: app-dist
          output-file: uhdr-gui
          windows-console-mode: disable
          enable-plugins: pyside6
          include-data-dir: src/ultra_hdr_converter/ui/assets=ultra_hdr_converter/ui/assets
          include-package: imagecodecs
          output-dir: dist
          windows-icon-from-ico: src/ultra_hdr_converter/ui/assets/icon.ico
          macos-app-icon: src/ultra_hdr_converter/ui/assets/icon.icns
          linux-icon: src/ultra_hdr_converter/ui/assets/icon.png
          macos-sign-identity: ad-hoc
          macos-signed-app-name: com.ultrahdr.converter

      - name: Rename output
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            APP_BUNDLE=$(find dist -maxdepth 2 -name "*.app" | head -n 1)
            if [ -n "$APP_BUNDLE" ] && [ "$APP_BUNDLE" != "dist/uhdr-gui.app" ]; then
              mv "$APP_BUNDLE" dist/uhdr-gui.app
            fi
            rm -rf dist/gui.dist
          else
            mv dist/gui.dist dist/uhdr-gui
            if [ -f "dist/uhdr-gui/uhdr-gui.bin" ]; then
              mv dist/uhdr-gui/uhdr-gui.bin dist/uhdr-gui/uhdr-gui
            fi
          fi

      - name: Attach license files to bundle (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cp LICENSE dist/LICENSE
            cp THIRD_PARTY_NOTICES.txt dist/THIRD_PARTY_NOTICES.txt
          else
            cp LICENSE dist/uhdr-gui/LICENSE
            cp THIRD_PARTY_NOTICES.txt dist/uhdr-gui/THIRD_PARTY_NOTICES.txt
          fi

      - name: Attach license files to bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item LICENSE dist/uhdr-gui/LICENSE -Force
          Copy-Item THIRD_PARTY_NOTICES.txt dist/uhdr-gui/THIRD_PARTY_NOTICES.txt -Force

      - name: Package bundle (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            zip -r uhdr-gui-${{ matrix.asset_name }}.zip dist/uhdr-gui.app dist/LICENSE dist/THIRD_PARTY_NOTICES.txt
          else
            zip -r uhdr-gui-${{ matrix.asset_name }}.zip dist/uhdr-gui
          fi

      - name: Package bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/uhdr-gui -DestinationPath uhdr-gui-${{ matrix.asset_name }}.zip

      - name: Upload packaged bundle
        uses: actions/upload-artifact@v4
        with:
          name: uhdr-gui-${{ matrix.asset_name }}
          path: uhdr-gui-${{ matrix.asset_name }}.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Collect release archives
        run: find release-assets -type f -name '*.zip' -exec cp {} . \;

      - name: Verify license files in release archives
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archives = sorted(Path('.').glob('uhdr-gui-*.zip'))
          if not archives:
              raise SystemExit('No release archives found to verify.')

          required_files = {'LICENSE', 'THIRD_PARTY_NOTICES.txt'}

          for archive in archives:
              with ZipFile(archive) as zipped:
                  names = {Path(name).name for name in zipped.namelist()}
              missing = required_files - names
              if missing:
                  raise SystemExit(f"{archive} is missing required files: {sorted(missing)}")

          print('All release archives include required license files.')
          PY

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: uhdr-gui-*.zip
