name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: linux
            icon_flag: ""
          - os: windows-latest
            asset_name: windows
            # PyInstaller uses .ico on Windows; the PNG is converted at build time.
            icon_flag: "--icon=src/ultra_hdr_converter/ui/assets/icon.png"
          - os: macos-latest
            asset_name: macos
            # PyInstaller accepts PNG on macOS (wraps into .icns automatically).
            icon_flag: "--icon=src/ultra_hdr_converter/ui/assets/icon.png"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --group dev --extra gui

      # Linux: install binutils so PyInstaller bootloader links correctly.
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y binutils

      - name: Build GUI bundle
        shell: bash
        run: |
          uv run pyinstaller \
            --onedir \
            --name uhdr-gui \
            --windowed \
            ${{ matrix.icon_flag }} \
            --add-data "src/ultra_hdr_converter/ui/assets:ultra_hdr_converter/ui/assets" \
            --hidden-import ultra_hdr_converter.ui.assets \
            --distpath dist \
            --workpath build \
            --clean \
            -y \
            src/ultra_hdr_converter/ui/gui.py

      - name: Attach license files to bundle (Unix)
        if: runner.os != 'Windows'
        run: |
          cp LICENSE dist/uhdr-gui/LICENSE
          cp THIRD_PARTY_NOTICES.txt dist/uhdr-gui/THIRD_PARTY_NOTICES.txt

      - name: Attach license files to bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item LICENSE dist/uhdr-gui/LICENSE -Force
          Copy-Item THIRD_PARTY_NOTICES.txt dist/uhdr-gui/THIRD_PARTY_NOTICES.txt -Force

      - name: Package bundle (Unix)
        if: runner.os != 'Windows'
        run: zip -r uhdr-gui-${{ matrix.asset_name }}.zip dist/uhdr-gui

      - name: Package bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/uhdr-gui -DestinationPath uhdr-gui-${{ matrix.asset_name }}.zip

      - name: Upload packaged bundle
        uses: actions/upload-artifact@v4
        with:
          name: uhdr-gui-${{ matrix.asset_name }}
          path: uhdr-gui-${{ matrix.asset_name }}.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Collect release archives
        run: find release-assets -type f -name '*.zip' -exec cp {} . \;

      - name: Verify license files in release archives
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archives = sorted(Path('.').glob('uhdr-gui-*.zip'))
          if not archives:
              raise SystemExit('No release archives found to verify.')

          required_files = {'LICENSE', 'THIRD_PARTY_NOTICES.txt'}

          for archive in archives:
              with ZipFile(archive) as zipped:
                  names = {Path(name).name for name in zipped.namelist()}
              missing = required_files - names
              if missing:
                  raise SystemExit(f"{archive} is missing required files: {sorted(missing)}")

          print('All release archives include required license files.')
          PY

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: uhdr-gui-*.zip
